# docker run -itd --ipc=host --gpus=all --env="NVIDIA_DRIVER_CAPABILITIES=all" --net host --privileged \
#   -e DISPLAY=unix${DISPLAY} -e NVIDIA_VISIBLE_DEVICES=0 -v /tmp/.X11-unix:/tmp/.X11-unix \
#   --name localizer_rl localizer_rl:latest
# と同じ設定
name: localizer_rl
services:
  localizer:
    build:
      context: .
    image: localizer_rl:latest
    container_name: localizer_rl
    stdin_open: true
    tty: true
    ipc: host
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=unix${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
